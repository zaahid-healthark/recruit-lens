# Render Blueprint for the RecruitLens backend.
# Create everything in one shot: Render Dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates the web service below. See DEPLOY.md for
# the click-by-click walkthrough.
#
# Deploys from `chore/deploy-render-eas`, NOT main — this is the test/staging
# setup and main is intentionally left untouched. Point the Blueprint wizard's
# branch selector at the same branch when creating it.
#
# NOTE: the database is deliberately NOT defined here. Render's free plan
# allows only one free Postgres per account, and this account's free slot is
# already used by a separate, live project that must not be touched. So this
# blueprint has no `databases:` block — DATABASE_URL is a plain secret you
# paste in yourself, pointed at a free instance from Neon (or Supabase/any
# other Postgres host) instead. See DEPLOY.md Part 1 for the Neon steps.

services:
  - type: web
    name: recruitlens-api
    runtime: node
    plan: free # Free instances sleep after ~15 min idle; first request then takes ~50 s.
    region: singapore
    branch: chore/deploy-render-eas
    healthCheckPath: /health
    # Install only the `shared` + `server` workspaces — pulling in the React Native
    # dependency tree would blow past the free tier's build memory for no reason.
    # `postinstall` in server/package.json runs `prisma generate`.
    buildCommand: npm install --include-workspace-root -w shared -w server && npm run migrate:deploy -w server
    startCommand: npm run start -w server
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # ── Set these three yourself in the Render dashboard (never committed) ──
      # DATABASE_URL: the connection string from Neon (or wherever the DB lives).
      # Must include ?sslmode=require (Neon's copy-paste string already has it).
      - key: DATABASE_URL
        sync: false
      # API_KEY: the shared secret; the same string goes into mobile/eas.json.
      - key: API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # ── AI pipeline ──
      - key: MOCK_AI
        value: "false"
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-transcribe-diarize
      - key: OPENAI_EVAL_MODEL
        value: gpt-5.4
      - key: BULK_CONCURRENCY
        value: "1"
      # Uploaded audio. The free tier has no persistent disk, so this is scratch
      # space either way — /tmp just makes it independent of the working directory.
      - key: STORAGE_DIR
        value: /tmp/recruitlens-uploads
