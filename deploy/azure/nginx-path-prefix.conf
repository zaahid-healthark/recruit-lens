# Mount the RecruitLens API under a path on a site that already has TLS.
#
# Paste these two blocks INSIDE the existing `server { listen 443 ssl; ... }`
# block for your domain — do not create a new server block, and do not touch
# the existing certificate lines. Nothing else in that file needs to change.
#
# Result: https://yourdomain.com/interview/api/... reaches this backend, while
# `/` (your frontend) and `/api` (your other backend) are untouched. nginx
# matches the LONGEST prefix, so `/interview/api/` wins over `/` without
# needing any ordering games.
#
# Replace 4100 if node is listening elsewhere — check first with:
#   sudo ss -ltnp | grep -E '4[0-9]{3}'

# Typed by hand without the trailing slash, this would fall through to the
# frontend and render a confusing 404 page instead of an API response.
location = /interview/api {
    return 301 /interview/api/;
}

location /interview/api/ {
    # The trailing slash here is load-bearing: it strips "/interview/api" so
    # the backend sees "/recordings", not "/interview/api/recordings". The app
    # is unaware it is mounted under a prefix. Removing this slash breaks
    # every route with a 404.
    proxy_pass http://127.0.0.1:4100/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Multer accepts uploads up to 500 MB; nginx defaults to 1 MB, which would
    # 413 every real recording. Scoped to this location so the limit does not
    # leak into the rest of the site.
    client_max_body_size 512m;

    # Importing runs a synchronous ffmpeg decode (silence check + duration)
    # before responding, and a 25-minute call can outlast the 60s defaults.
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;

    # Stream uploads straight through rather than spooling 500 MB to disk, and
    # stream responses back unbuffered so Range requests on /recordings/:id/audio
    # start playing immediately instead of after a full buffer.
    proxy_request_buffering off;
    proxy_buffering         off;
}
