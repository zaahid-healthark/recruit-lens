# nginx site for the RecruitLens API.
#
# Serves TLS on port 8100 and proxies to node on 127.0.0.1:4000, which is never
# exposed to the internet. Port 80 exists ONLY so Let's Encrypt can validate:
# the HTTP-01 challenge is hard-wired to port 80 and cannot be moved to 8100,
# so 80 has to stay reachable for issuance and for every 60-day renewal.
#
# __API_DOMAIN__ is replaced by setup.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # certbot --webroot writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Anything else on 80 is a mistake — send it to the real endpoint, port and all.
    location / {
        return 301 https://$host:8100$request_uri;
    }
}

server {
    listen 8100 ssl;
    listen [::]:8100 ssl;
    http2 on;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Multer accepts uploads up to 500 MB. nginx's default is 1 MB, which would
    # 413 every real recording — this MUST stay above the multer limit.
    client_max_body_size 512m;

    # Importing a recording runs a synchronous ffmpeg decode (silence check +
    # duration) before responding, and a 25-minute call can take a while on a
    # burstable VM. The 60s defaults would cut that off mid-analysis.
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;

    # Stream uploads straight to node instead of spooling the whole 500 MB to
    # disk first, and stream responses back unbuffered so Range requests on the
    # audio endpoint start playing immediately.
    proxy_request_buffering off;
    proxy_buffering         off;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /health is the only unauthenticated route; keep it out of the access log
    # so an uptime pinger does not bury real traffic.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }
}
