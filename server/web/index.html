<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="description" content="RecruitLens — screening-call reports and decisions." />
    <title>RecruitLens</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d3a5f'/%3E%3Cpath d='M10 23V9h6.2c3 0 4.8 1.7 4.8 4.3 0 2-1.1 3.4-2.9 4l3.3 5.7h-3.5l-2.9-5.2H13V23z M13 15.3h3c1.2 0 1.9-.7 1.9-1.8s-.7-1.8-1.9-1.8h-3z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint, so dark mode never flashes light.
      (function () {
        try {
          var p = localStorage.getItem("recruitlens.theme");
          var dark = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <!-- Every URL is relative: the app is served under a path prefix in production. -->
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="gate"><span class="spinner lg" aria-label="Loading"></span></div>
    </div>
    <noscript><p style="padding: 24px; font-family: system-ui">RecruitLens needs JavaScript enabled.</p></noscript>
  </body>
</html>
